{% extends 'base.html' %}

{% block title %}Пароль обновлен - VXcloud{% endblock %}

{% block content %}
<section class="surface-card auth-shell site-auth-shell vx-account-bot vx-auth-bot">
  <p class="vx-bot-eyebrow">Аккаунт VXcloud</p>
  <h1 class="vx-bot-title vx-auth-title">Пароль обновлен</h1>
  <p class="vx-bot-line">Теперь можно войти с новым паролем.</p>
  <div class="vx-bot-actions">

  </div>
</section>
{% endblock %}
