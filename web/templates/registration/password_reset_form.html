{% extends 'base.html' %}

{% block title %}Восстановление пароля - VXcloud{% endblock %}

{% block content %}
<section class="surface-card auth-shell site-auth-shell vx-account-bot vx-auth-bot">
  <p class="vx-bot-eyebrow">Аккаунт VXcloud</p>
  <h1 class="vx-bot-title vx-auth-title">Восстановление пароля</h1>
  <p class="vx-bot-line">Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="account-primary-button auth-submit">Отправить ссылку</button>
  </form>
</section>
{% endblock %}
